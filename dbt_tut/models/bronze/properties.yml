version: 2

models:
    - name: bronze_date # Must match the name of the model file excluding the .sql extension
      config:
        materialized: table
        schema: bronze

    - name: bronze_store
      config:
        materialized: table
        schema: bronze
      columns:
        - name: store_sk
          data_tests:
            - unique
            - not_null
        - name: store_name
          data_tests:
            - accepted_values:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
                severity: warn

    - name: bronze_sales
      columns:
        - name: sales_id
          data_tests:
            - unique
            - not_null
        - name: gross_amount
          data_tests:
            - generic_non_negative